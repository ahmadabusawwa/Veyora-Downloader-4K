name: Windows EXE and Setup review
on:
  workflow_dispatch:
  # Build on a draft review PR as well as direct pushes; never publish a release.
  pull_request:
    branches: ['development/veyora-2.0.3-regression-recovery']
  push:
    branches: ['development/veyora-2-automation', 'repair/veyora-2-*', 'development/veyora-2.0.2-*', 'development/veyora-ui-*', 'development/veyora-media-*', 'development/veyora-2.0.3-final-fixes', 'development/veyora-2.0.3-regression-recovery']
concurrency:
  group: windows-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  source:
    name: Archive exact full source even when Windows verification fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive the exact checked-out source and record SHA-256
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=Veyora-Pro/ --output=dist/Veyora-Pro-2.0.3-Full-Source.zip HEAD
          sha256sum dist/Veyora-Pro-2.0.3-Full-Source.zip > dist/Veyora-Pro-2.0.3-Full-Source.sha256
          test -s dist/Veyora-Pro-2.0.3-Full-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Veyora-Pro-2.0.3-Review-Full-Source
          path: |
            dist/Veyora-Pro-2.0.3-Full-Source.zip
            dist/Veyora-Pro-2.0.3-Full-Source.sha256
          compression-level: 0
          retention-days: 90
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install packaging tools with package checksum verification
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if (-not $LASTEXITCODE) { break }
            if ($attempt -eq 3) { throw 'FFmpeg package installation failed after bounded retries' }
            Start-Sleep -Seconds 5
          }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          $exe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'FFmpeg executable missing' }
          $notice = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)(\.txt)?$' } | Select-Object -First 1
          if (-not $notice) { throw 'FFmpeg distribution license missing' }
          if ($notice.FullName -ne (Join-Path $exe.DirectoryName 'LICENSE.txt')) { Copy-Item $notice.FullName (Join-Path $exe.DirectoryName 'LICENSE.txt') }
          "VEYORA_FFMPEG_DIR=$($exe.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preserve previous working Setup as backup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41126099174 --repo ahmadabusawwa/Veyora-Downloader-4K --name Veyora-Pro-Setup --dir previous-review
          if ($LASTEXITCODE) { throw 'Could not preserve the previous working Setup' }
          New-Item -ItemType Directory -Force backups | Out-Null
          Copy-Item previous-review/Veyora-Pro-Setup.exe backups/Veyora-Pro-Setup-2.0.3-previous.exe
          if ((Get-FileHash backups/Veyora-Pro-Setup-2.0.3-previous.exe).Hash -ne '6E3F669D7D8759CEEDBE876899CA898B8D79C9C0467F6265CE8B7C65A211FCB8') { throw 'Previous Setup hash mismatch' }
          gh run download 41157259590 --repo ahmadabusawwa/Veyora-Downloader-4K --name Veyora-Pro-2.0.3-Setup --dir before-p0
          if ($LASTEXITCODE) { throw 'Latest working Setup backup download failed' }
          Copy-Item before-p0/Veyora-Pro-2.0.3-Setup.exe backups/Veyora-Pro-2.0.3-before-P0-Setup.exe
          if ((Get-FileHash backups/Veyora-Pro-2.0.3-before-P0-Setup.exe).Hash -ne 'B0F65CE538912025EDA11FE7743868600A9514DAAF199B7F7508DBC3308724BA') { throw 'Latest working Setup hash mismatch' }
          Get-FileHash backups/Veyora-Pro-Setup-2.0.3-previous.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content backups/previous-setup-sha256.json
      - name: Build tested EXE and Setup
        shell: pwsh
        run: .\build_windows_2.ps1
      - name: Prepare verified local models for installed translation tests
        shell: pwsh
        run: |
          $env:VEYORA_CONFIG_DIR=Join-Path $env:RUNNER_TEMP 'veyora-model-review'
          & .\.build-venv\Scripts\python.exe prepare_translation.py --speech --speech-model base.en
          if ($LASTEXITCODE) { throw 'Translation model preparation failed' }
          "VEYORA_TEST_MODELS=$(Join-Path $env:VEYORA_CONFIG_DIR 'models')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Actual packaged installation and uninstall checks
        shell: pwsh
        run: .\tools\test_installer.ps1 -Setup .\dist\setup\Veyora-Pro-2.0.3-Setup.exe
      - name: Generate report from actual outcomes
        if: always()
        shell: pwsh
        run: python tools/write_test_report.py
      - name: Package exact source and portable outputs
        shell: pwsh
        run: |
          Compress-Archive dist\Veyora-Pro\* dist\Veyora-Pro-2.0.3-Windows-Portable.zip
          Copy-Item dist/setup/Veyora-Pro-2.0.3-Setup.exe dist/Veyora-Pro-2.0.3-Setup.exe
          git archive --format=zip --prefix=Veyora-Pro/ --output=dist/Veyora-Pro-2.0.3-Full-Source.zip HEAD
          if ($LASTEXITCODE) { throw 'Source archive failed' }
          python tools/verify_delivery.py
          if ($LASTEXITCODE) { throw 'Delivery verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Veyora-Pro-2.0.3-Full-Source
          path: dist/Veyora-Pro-2.0.3-Full-Source.zip
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Veyora-Pro-2.0.3-Windows-Portable
          path: dist/Veyora-Pro-2.0.3-Windows-Portable.zip
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Veyora-Pro-2.0.3-Setup
          path: dist/Veyora-Pro-2.0.3-Setup.exe
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veyora-Pro-2.0.3-Test-Report
          path: |
            dist/*Test-Report.md
            dist/*Regression-Report.md
            dist/*Control-Inventory.json
            dist/*File-Verification.json
            dist/actual-test-results.json
            dist/confirmation-lifecycle*/**
            dist/confirmation-lifecycle-results.json
            windows-tests.xml
            installed-translation.json
            real-video-review/**
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veyora-Pro-2.0.3-Previous-Backup
          path: backups/**
          retention-days: 90
