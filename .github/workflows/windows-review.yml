name: Windows review (no publication)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Install verified FFmpeg for actual multimedia integration tests
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress
          if ($LASTEXITCODE) { throw 'FFmpeg installation failed' }
          $bin = Get-ChildItem C:\\ProgramData\\chocolatey\\lib\\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'FFmpeg installation did not supply ffmpeg.exe' }
          $env:GITHUB_PATH | Out-Null
          $bin.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - run: python -m pytest tests -q --junitxml=windows-tests.xml
      - run: python tools/gui_smoke.py --output gui-review.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-review-evidence
          path: |
            windows-tests.xml
            gui-review.png
