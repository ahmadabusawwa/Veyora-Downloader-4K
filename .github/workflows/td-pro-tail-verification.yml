name: TD Pro 2.0.3 tail-retry verification

on:
  push:
    branches:
      - repair/another-love-vad-tail-review-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression-and-source:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run targeted recognition tail tests
        run: python -m pytest tests/test_transcription_tail_retry.py -q
      - name: Run project regression suite
        run: python -m pytest -q
      - name: Prepare exact complete source snapshot with SHA-256
        if: always()
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('.')
          out = pathlib.Path('delivery')
          out.mkdir(exist_ok=True)
          archive = out / 'Veyora-Pro-2.0.3-Full-Source-Development.zip'
          files = [p for p in root.rglob('*') if p.is_file()
                   and '.git' not in p.parts and 'delivery' not in p.parts
                   and '.pytest_cache' not in p.parts and '__pycache__' not in p.parts]
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, p.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          info = {'commit': os.environ['GITHUB_SHA'],
                  'file': archive.name, 'bytes': archive.stat().st_size,
                  'sha256': digest, 'file_count': len(files),
                  'disposition': 'development only; Windows app install and real song ASR not certified'}
          (out / 'source-verification.json').write_text(json.dumps(info, indent=2), encoding='utf8')
          print(json.dumps(info, indent=2))
          '@ | python -
      - name: Upload full source and checksum (even if tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-pro-2.0.3-full-source-development
          path: delivery/
          if-no-files-found: error
          retention-days: 30
